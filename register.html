<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Job<span>Finder</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#featured-jobs">Jobs</a></li>
                <li><a href="index.html#categories">Companies</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="login.html" class="login">Login</a>
                <a href="register.html" class="register">Register</a>
            </div>
        </nav>
    </header>

    <section class="form-section">
        <div class="form-container">
            <h1>Create Account 🚀</h1>
            <p class="form-subtitle">Join JobFinder and discover new opportunities</p>

            <form id="registerForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                <label class="terms">
                    <input type="checkbox" required>
                    I agree to the Terms & Conditions
                </label>

                <button type="submit" class="form-button">Create Account</button>
            </form>

            <p class="form-bottom">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
