<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Job<span>Finder</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#featured-jobs">Jobs</a></li>
                <li><a href="index.html#categories">Companies</a></li>
                <li><a href="index.html#about">About</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="login.html" class="login">Login</a>
                <a href="register.html" class="register">Register</a>
            </div>
        </nav>
    </header>

    <section class="form-section">
        <div class="form-container">
            <h1>Welcome Back 👋</h1>
            <p class="form-subtitle">Login to continue your job search</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>
                    <a href="#" id="forgotPasswordLink">Forgot Password?</a>
                </div>

                <button type="submit" class="form-button">Login</button>
            </form>

            <p class="form-bottom">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>
    </section>

    <script src="login.js"></script>
</body>
</html>
