<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile - JobFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Job<span>Finder</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#featured-jobs">Jobs</a></li>
                <li><a href="profile.html">My Profile</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="login.html" class="login">Login</a>
                <a href="register.html" class="register">Register</a>
            </div>
        </nav>
    </header>

    <section class="form-section">
        <div class="profile-container">
            <h1>Create Your Profile 👤</h1>
            <p class="form-subtitle">Tell employers about yourself</p>

            <form id="profileForm">
                <h2>Personal Information</h2>
                <div class="form-row">
                    <div>
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="First name" required>
                    </div>
                    <div>
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Last name" required>
                    </div>
                </div>

                <label for="profileEmail">Email</label>
                <input type="email" id="profileEmail" placeholder="Enter your email" required>

                <label for="profilePhone">Phone Number</label>
                <input type="tel" id="profilePhone" placeholder="Enter your phone number">

                <label for="profileLocation">Location</label>
                <input type="text" id="profileLocation" placeholder="City, State">

                <h2>Professional Information</h2>
                <label for="jobTitle">Job Title</label>
                <input type="text" id="jobTitle" placeholder="e.g. Frontend Developer">

                <label for="experience">Experience</label>
                <select id="experience">
                    <option value="">Select Experience</option>
                    <option>Fresher</option>
                    <option>1 - 2 Years</option>
                    <option>3 - 5 Years</option>
                    <option>5 - 10 Years</option>
                    <option>10+ Years</option>
                </select>

                <label for="skills">Skills</label>
                <input type="text" id="skills" placeholder="e.g. HTML, CSS, JavaScript, React">

                <label for="education">Education</label>
                <input type="text" id="education" placeholder="e.g. B.Tech Computer Science">

                <label for="about">About Yourself</label>
                <textarea id="about" rows="5" placeholder="Write a short description about yourself..."></textarea>

                <h2>Resume</h2>
                <label for="resumeFile">Upload Resume</label>
                <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">

                <button type="submit" class="form-button">Save Profile</button>
            </form>
        </div>
    </section>

    <script src="profile.js"></script>
</body>
</html>
